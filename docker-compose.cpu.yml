# No NVIDIA GPU (slow, for trying things out):
#   docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d --build
services:
  puppycam:
    build:
      args:
        BASE: python:3.12-slim
        TORCH_INDEX: https://download.pytorch.org/whl/cpu
    image: puppycam:cpu
    environment:
      DEVICE: cpu
      IMGSZ: "960"
      PROCESS_FPS: "1"
    deploy: !reset {}
